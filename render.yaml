services:
  - type: web
    name: emafrs-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: CORS_ORIGINS
        value: "http://localhost:5173"  # update to your Vercel URL after the frontend deploy, e.g. https://emafrs-amif.vercel.app
      - key: DATABASE_URL
        value: sqlite:////app/data/emafrs.db
      - key: LOG_LEVEL
        value: INFO
      - key: ENVIRONMENT
        value: production
      - key: YOUTUBE_API_KEY
        sync: false
      - key: NEWS_API_KEY
        sync: false
      - key: ALPHAVANTAGE_API_KEY
        sync: false
      - key: FINNHUB_API_KEY
        sync: false
      - key: FRED_API_KEY
        sync: false
      - key: SEC_EDGAR_USER_AGENT
        value: "EMAFRS-Research-Reconstruction you@example.com"
