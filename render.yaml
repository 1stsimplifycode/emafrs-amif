services:
  - type: web
    name: emafrs-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: CORS_ORIGINS
        value: "http://localhost:5173"  # update to your Vercel URL after the frontend deploy, e.g. https://emafrs-amif.vercel.app
      - key: DATABASE_URL
        value: sqlite:////app/data/emafrs.db
      - key: LOG_LEVEL
        value: INFO
      - key: ENVIRONMENT
        value: production
      - key: YOUTUBE_API_KEY
        sync: false
      - key: NEWS_API_KEY
        sync: false
      - key: ALPHAVANTAGE_API_KEY
        sync: false
      - key: FINNHUB_API_KEY
        sync: false
      - key: FRED_API_KEY
        sync: false
      - key: SEC_EDGAR_USER_AGENT
        value: "EMAFRS-Research-Reconstruction you@example.com"
      # Real background scheduler (emafrs.mlops.scheduler) -- see docs/DEPLOYMENT.md for
      # the real quota/uptime tradeoffs of running this on Render's free tier before
      # changing these.
      - key: SCHEDULER_ENABLED
        value: "true"
      - key: SCHEDULER_INTERVAL_SECONDS
        value: "21600"
      - key: SCHEDULER_TICKERS
        value: "SPY,QQQ,AAPL,MSFT,NVDA"
      - key: SCHEDULER_HEALTH_LIVE_PROBE
        value: "false"
      - key: SCHEDULER_INCLUDE_TEXT
        value: "false"
