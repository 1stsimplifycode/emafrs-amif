services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:////app/data/emafrs.db
      - LOG_LEVEL=INFO
      - CORS_ORIGINS=http://localhost:5173,http://localhost:8080
      # API keys: set these in a local .env (never committed) or the shell environment.
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY:-}
      - NEWS_API_KEY=${NEWS_API_KEY:-}
      - ALPHAVANTAGE_API_KEY=${ALPHAVANTAGE_API_KEY:-}
      - FINNHUB_API_KEY=${FINNHUB_API_KEY:-}
      - FRED_API_KEY=${FRED_API_KEY:-}
      - SEC_EDGAR_USER_AGENT=${SEC_EDGAR_USER_AGENT:-EMAFRS-Docker (contact not set)}
    volumes:
      - emafrs_data:/app/data
      - emafrs_checkpoints:/app/models/checkpoints
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  emafrs_data:
  emafrs_checkpoints:
