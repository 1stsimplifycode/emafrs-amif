[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "emafrs"
version = "0.1.0"
description = "Explainable Multimodal Affective Financial Reasoning System (EMAFRS) / AI Market Integrity Framework (AMIF) — research reconstruction"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
